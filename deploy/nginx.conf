# IAMS reverse proxy. Replace <host> with the real DNS name (or the VPS IP).
# TLS certs are mounted from /opt/iams/certs (see docker-compose.prod.yml).

server {
    listen 80;
    server_name <host>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <host>;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploads: multer caps at 50 MB in-app; nginx must not cut requests off first.
    client_max_body_size 60m;

    # Backend API
    location /api/v1/ {
        proxy_pass http://iams-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;   # PDF/DOCX exports can take a while
    }

    location /health {
        proxy_pass http://iams-api:3000;
    }

    # Everything else — Next.js (pages, /api/auth/* BFF, /api/proxy/*)
    location / {
        proxy_pass http://iams-web:3001;

        # The BFF login/refresh responses carry Set-Cookie headers with the
        # access JWT (all roles + permissions — large for the super admin).
        # nginx's default 4k/8k proxy buffer overflows on them → 502
        # "upstream sent too big header". 32k gives ample headroom.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
